services:
  api:
    build: .
    container_name: whoslive-api
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/app                      # Mount source code for hot reload
      - /app/node_modules           # Preserve node_modules in container
      - /app/dist                   # Preserve dist folder
    environment:
      - NODE_ENV=development        # Change to 'production' for prod
    env_file:
      - ./config/dev.env            # Change to ./config/prod.env for production
    command: npm run start:dev      # Change to 'npm run start:prod' for production
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:6
    container_name: whoslive-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db         # Only mount MongoDB data, not app code
    environment:
      - MONGO_INITDB_DATABASE=whoslive

  redis:
    image: redis:7
    container_name: whoslive-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data            # Persist Redis data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  mongo_data:
  redis_data: